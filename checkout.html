<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout | Cozy Crochet Corner 🧶</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --pink: #f7c9d4;
  --pink-soft: #fbe4ea;
  --beige: #f5e9d8;
  --brown: #8b6f5a;
  --text: #5a4a42;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(0,0,0,0.12);
  --font: "Poppins", system-ui, sans-serif;
}

body {
  margin: 0;
  font-family: var(--font);
  background: linear-gradient(135deg, var(--pink-soft), var(--beige));
  color: var(--text);
  overflow-x: hidden;
}

/* FLOATING HEARTS */
#floatingHearts {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -1;
}

.heart {
  position: absolute;
  font-size: 28px;
  opacity: 0.6;
  animation: floatUp 8s linear infinite;
  filter: blur(0.3px);
}

@keyframes floatUp {
  0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.7; }
  100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
}

/* HEADER */
.checkout-header {
  text-align: center;
  padding: 40px 20px;
}

.checkout-header h2 {
  font-size: 34px;
  margin-bottom: 10px;
}

.checkout-box {
  max-width: 600px;
  margin: 0 auto;
  background: rgba(255,255,255,0.95);
  padding: 26px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.item {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #e8dcd2;
}

.total {
  font-size: 20px;
  font-weight: 700;
  margin-top: 20px;
  text-align: right;
}

.buy-btn {
  width: 100%;
  margin-top: 20px;
  background: var(--pink);
  border: none;
  padding: 14px;
  border-radius: var(--radius);
  font-size: 18px;
  cursor: pointer;
  box-shadow: var(--shadow);
}

.buy-btn:hover {
  background: var(--brown);
  color: white;
}
</style>
</head>
<body>

<div id="floatingHearts"></div>

<div class="checkout-header">
  <h2>Your Cart 🧺💗</h2>
  <p>Review your items before checkout.</p>
</div>

<div class="checkout-box" id="cartBox">
  <!-- JS will fill this -->
</div>

<script>
/* FLOATING HEARTS */
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.textContent = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = 20 + Math.random() * 20 + "px";
  heart.style.animationDuration = 6 + Math.random() * 4 + "s";
  document.getElementById("floatingHearts").appendChild(heart);
  setTimeout(() => heart.remove(), 10000);
}
setInterval(createHeart, 400);

/* ------------------------------
   LOAD CART
------------------------------ */
function loadCart() {
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  const box = document.getElementById("cartBox");

  if (cart.length === 0) {
    box.innerHTML = "<p>Your cart is empty 💗</p>";
    return;
  }

  let html = "";
  let total = 0;

  cart.forEach(item => {
    const subtotal = item.price * item.qty;
    total += subtotal;

    html += `
      <div class="item">
        <span>${item.name} (x${item.qty})</span>
        <span>€${subtotal.toFixed(2)}</span>
      </div>
    `;
  });

  html += `
    <div class="total">Total: €${total.toFixed(2)}</div>
    <button class="buy-btn" onclick="checkout()">Buy Now</button>
  `;

  box.innerHTML = html;
}

loadCart();

/* ------------------------------
   CHECKOUT BUTTON
------------------------------ */
function checkout() {
  alert("Redirecting to payment 💗");
  // Example: window.location.href = "https://your-gumroad-link";
}
</script>

</body>
</html>
