<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout | Cozy Crochet Corner 🧶</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --pink: #f7c9d4;
  --pink-soft: #fbe4ea;
  --beige: #f5e9d8;
  --brown: #8b6f5a;
  --text: #5a4a42;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(0,0,0,0.12);
  --font: "Poppins", system-ui, sans-serif;
}

body {
  margin: 0;
  font-family: var(--font);
  background: linear-gradient(135deg, var(--pink-soft), var(--beige));
  color: var(--text);
  overflow-x: hidden;
}

/* FLOATING HEARTS */
#floatingHearts {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -1;
}

.heart {
  position: absolute;
  font-size: 28px;
  opacity: 0.6;
  animation: floatUp 8s linear infinite;
  filter: blur(0.3px);
}

@keyframes floatUp {
  0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.7; }
  100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 26px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 10;
}

.navbar h1 {
  font-size: 22px;
  font-weight: 700;
}

.nav-links a {
  text-decoration: none;
  color: var(--text);
  font-size: 15px;
  margin-left: 16px;
  transition: 0.2s;
}

.nav-links a:hover {
  color: var(--brown);
}

/* HEADER */
.checkout-header {
  text-align: center;
  padding: 40px 20px;
}

.checkout-header h2 {
  font-size: 34px;
  margin-bottom: 10px;
}

.checkout-box {
  max-width: 650px;
  margin: 0 auto;
  background: rgba(255,255,255,0.95);
  padding: 26px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* CART ITEM */
.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #e8dcd2;
}

.item-name {
  font-size: 16px;
  font-weight: 600;
}

.qty-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.qty-btn {
  background: var(--pink);
  border: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  transition: 0.2s;
}

.qty-btn:hover {
  background: var(--brown);
  color: white;
}

.remove-btn {
  background: none;
  border: none;
  color: var(--brown);
  font-size: 13px;
  cursor: pointer;
  opacity: 0.7;
}

.remove-btn:hover {
  opacity: 1;
  text-decoration: underline;
}

.total {
  font-size: 22px;
  font-weight: 700;
  margin-top: 20px;
  text-align: right;
}

.buy-btn {
  width: 100%;
  margin-top: 20px;
  background: var(--pink);
  border: none;
  padding: 14px;
  border-radius: var(--radius);
  font-size: 18px;
  cursor: pointer;
  box-shadow: var(--shadow);
}

.buy-btn:hover {
  background: var(--brown);
  color: white;
}
</style>
</head>
<body>

<div id="floatingHearts"></div>

<!-- NAVBAR -->
<div class="navbar">
  <h1>🧶 Cozy Crochet Corner</h1>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="patterns.html">Patterns</a>
    <a href="shop.html">Shop</a>
    <a href="checkout.html">Cart 🧺</a>
  </div>
</div>

<div class="checkout-header">
  <h2>Your Cart 🧺💗</h2>
  <p>Review your items before checkout.</p>
</div>

<div class="checkout-box" id="cartBox">
  <!-- JS will fill this -->
</div>

<script>
/* FLOATING HEARTS */
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.textContent = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = 20 + Math.random() * 20 + "px";
  heart.style.animationDuration = 6 + Math.random() * 4 + "s";
  document.getElementById("floatingHearts").appendChild(heart);
  setTimeout(() => heart.remove(), 10000);
}
setInterval(createHeart, 400);

/* ------------------------------
   LOAD CART (with qty + remove)
------------------------------ */
function loadCart() {
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  const box = document.getElementById("cartBox");

  if (cart.length === 0) {
    box.innerHTML = "<p>Your cart is empty 💗</p>";
    return;
  }

  let html = "";
  let total = 0;

  cart.forEach((item, index) => {
    const subtotal = item.price * item.qty;
    total += subtotal;

    html += `
      <div class="item">
        <div>
          <div class="item-name">${item.name}</div>
          <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
        </div>

        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
          <span>${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
        </div>

        <div>€${subtotal.toFixed(2)}</div>
      </div>
    `;
  });

  html += `
    <div class="total">Total: €${total.toFixed(2)}</div>
    <button class="buy-btn" onclick="checkout()">Buy Now</button>
  `;

  box.innerHTML = html;
}

/* CHANGE QUANTITY */
function changeQty(index, amount) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart[index].qty += amount;

  if (cart[index].qty <= 0) {
    cart.splice(index, 1);
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

/* REMOVE ITEM */
function removeItem(index) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

/* CHECKOUT BUTTON */
function checkout() {
  alert("Redirecting to payment 💗");
  // window.location.href = "https://your-payment-link";
}

loadCart();
</script>

</body>
</html>
